name: Deploy AI-Brain Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute SHA-256 hash of Dashboard Passcode from GitHub Secret
        id: hash
        env:
          RAW_PASSCODE: ${{ secrets.DASHBOARD_PASSCODE }}
        run: |
          if [ -z "$RAW_PASSCODE" ]; then
            echo "::warning::DASHBOARD_PASSCODE secret is not set in GitHub Actions Secrets!"
            echo "passcode_hash=" >> "$GITHUB_OUTPUT"
          else
            HASH=$(printf '%s' "$RAW_PASSCODE" | sha256sum | awk '{print $1}')
            echo "::add-mask::$HASH"
            echo "passcode_hash=$HASH" >> "$GITHUB_OUTPUT"
          fi

      - name: Build production bundle
        env:
          VITE_PASSCODE_HASH: ${{ steps.hash.outputs.passcode_hash }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          VITE_DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID || '1xbgHAgoAoJIWEoERxdXILgC6N861F8h6' }}
          VITE_BOOTSTRAP_FILE_ID: ${{ vars.BOOTSTRAP_FILE_ID || '1qDVWA6wN55JfrHleKbb9Zd06jFqf8u2x' }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
